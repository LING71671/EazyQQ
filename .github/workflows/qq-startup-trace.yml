name: Collect QQ startup evidence
on:
  workflow_dispatch:
    inputs:
      fixture_tag:
        description: Private draft containing the immutable QQ fixture
        required: true
        type: string
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare immutable fixtures
        shell: pwsh
        env:
          FIXTURE_TAG: ${{ inputs.fixture_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory .test-runtime -Force | Out-Null
          gh release download $env:FIXTURE_TAG --pattern qq-native-qa.zip --dir .test-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = Join-Path $env:LOCALAPPDATA 'EazyQQ-QA/QQ NT'
          $program = Join-Path $env:ProgramFiles 'Tencent/QQNT'
          Expand-Archive .test-runtime/qq-native-qa.zip -DestinationPath $profile
          Expand-Archive .test-runtime/qq-native-qa.zip -DestinationPath $program
          "EAZYQQ_QA_PROFILE_QQ=$profile/QQ.exe" | Out-File $env:GITHUB_ENV -Append
          "EAZYQQ_QA_PROGRAM_QQ=$program/QQ.exe" | Out-File $env:GITHUB_ENV -Append
          $release = Invoke-RestMethod 'https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest'
          $asset = $release.assets | Where-Object name -eq 'NapCat.Shell.zip' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile .test-runtime/protocol.zip
          Expand-Archive .test-runtime/protocol.zip -DestinationPath napcat
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build diagnostic CLI
        run: pwsh -NoProfile -File scripts/cargo.ps1 build --bin eazyqq_cli
      - name: Collect runtime and paused inspector evidence
        run: python scripts/validation/qq_startup_matrix.py
      - name: Save evidence even if collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qq-startup-evidence
          include-hidden-files: true
          path: |
            .test-runtime/qq-trace-*/evidence.json
            .test-runtime/qq-trace-*/EazyQQ_Data/accounts/*/*/protocol/eazyqq-*-witness.json
            .test-runtime/qq-trace-*/EazyQQ_Data/accounts/*/*/protocol/eazyqq-startup-*.json
