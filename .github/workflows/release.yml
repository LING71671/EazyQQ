name: Release EazyQQ

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EAZYQQ_SENTRY_DSN: ${{ vars.EAZYQQ_SENTRY_CORE_DSN }}
      VITE_EAZYQQ_SENTRY_DSN: ${{ vars.EAZYQQ_SENTRY_UI_DSN }}
    steps:
      - name: Use canonical source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load publisher from the workflow revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'eazyqq-release-driver'
          New-Item -ItemType Directory -Path $driverDirectory -Force | Out-Null
          foreach ($name in @('publish.mjs', 'publish.test.mjs')) {
            $content = gh api "repos/$env:GITHUB_REPOSITORY/contents/scripts/release/${name}?ref=$env:GITHUB_SHA" --jq .content
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [IO.File]::WriteAllBytes((Join-Path $driverDirectory $name), [Convert]::FromBase64String(($content -join '')))
          }
          $publisher = Join-Path $driverDirectory 'publish.mjs'
          "EAZYQQ_RELEASE_PUBLISHER=$publisher" | Out-File $env:GITHUB_ENV -Append

      - name: Reject overwriting a public release
        shell: pwsh
        run: |
          node --test (Join-Path (Split-Path $env:EAZYQQ_RELEASE_PUBLISHER) 'publish.test.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $env:EAZYQQ_RELEASE_PUBLISHER --check

      - name: Install pnpm from package metadata
        uses: pnpm/action-setup@v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version' }
          pnpm version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "docs/release/$env:RELEASE_TAG.md")) { throw 'Chinese release notes are missing' }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare official NapCat resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest' -Headers @{ 'User-Agent' = 'EazyQQ-CI' }
          $asset = $release.assets | Where-Object name -eq 'NapCat.Shell.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Official NapCat.Shell.zip is unavailable' }
          $archive = Join-Path $env:RUNNER_TEMP 'NapCat.Shell.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          New-Item -ItemType Directory -Path napcat -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath napcat -Force
          pnpm prepare:resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release/check-resources.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check types, interfaces and frontend behavior
        shell: pwsh
        run: |
          pnpm presentation:check
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm contracts:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/ai/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ai/sync-native-faces.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust regressions
        run: pnpm test:rust

      - name: Build desktop and CLI
        run: pnpm tauri:build

      - name: Validate installed desktop bundle
        run: pwsh -NoProfile -File scripts/validation/install_bundle.ps1

      - name: Validate release CLI and native account profiles
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          Write-Output 'Validation stage: prepare native drivers'
          # Validation tools follow this workflow revision; application source stays tagged.
          $content = gh api "repos/$env:GITHUB_REPOSITORY/contents/scripts/validation/native_profiles.py?ref=$env:GITHUB_SHA" --jq .content
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $validator = Join-Path $env:RUNNER_TEMP 'native_profiles.py'
          [IO.File]::WriteAllBytes($validator, [Convert]::FromBase64String(($content -join '')))
          $content = gh api "repos/$env:GITHUB_REPOSITORY/contents/scripts/validation/cdp_transport.py?ref=$env:GITHUB_SHA" --jq .content
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $transportValidator = Join-Path $env:RUNNER_TEMP 'cdp_transport.py'
          [IO.File]::WriteAllBytes($transportValidator, [Convert]::FromBase64String(($content -join '')))
          $env:EAZYQQ_TEST_PROJECT_ROOT = (Get-Location).Path
          Write-Output 'Validation stage: CDP transport regressions'
          python $transportValidator $validator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Select-Object name,pv
          Get-ItemProperty 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Select-Object name,pv
          Write-Output 'Validation stage: release CLI smoke'
          pnpm test:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Validation stage: protocol recovery'
          python scripts/validation/protocol_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $content = gh api "repos/$env:GITHUB_REPOSITORY/contents/scripts/validation/webview_ipv6.py?ref=$env:GITHUB_SHA" --jq .content
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ipv6Validator = Join-Path $env:RUNNER_TEMP 'webview_ipv6.py'
          [IO.File]::WriteAllBytes($ipv6Validator, [Convert]::FromBase64String(($content -join '')))
          Write-Output 'Validation stage: IPv6 CDP discovery'
          python $ipv6Validator $validator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Validation stage: native account profiles'
          python $validator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep native startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-diagnostics
          include-hidden-files: true
          path: |
            .test-runtime/native-profiles-*/gui-stderr.log
            .test-runtime/native-profiles-*/login-layout*.png
            .test-runtime/native-profiles-*/login-layout.json
            .test-runtime/native-profiles-*/ai-health-synchronized.png
            .test-runtime/native-profiles-*/update-history-*.png
            .test-runtime/native-profiles-*/sentry-diagnostic.png
            .test-runtime/native-profiles-*/native-failure.png
            .test-runtime/native-profiles-*/free-model-failure.json
            .test-runtime/native-profiles-*/EazyQQ_Data/accounts/*/*/logs/*.log
          if-no-files-found: ignore

      - name: Prepare validated distribution assets
        run: pnpm release:package

      - name: Keep release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eazyqq-${{ env.RELEASE_TAG }}-windows-x64
          path: output/release/*/*
          if-no-files-found: error

      - name: Publish release after all checks pass
        shell: pwsh
        run: node $env:EAZYQQ_RELEASE_PUBLISHER
