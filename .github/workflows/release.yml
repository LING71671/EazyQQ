name: Release EazyQQ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Prepare bundled NapCat
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/napcat"
          New-Item -ItemType Directory -Force -Path $dest
          Write-Host "Fetching latest NapCat assets from GitHub..."
          $headers = @{ "User-Agent" = "EazyQQ-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest" -Headers $headers
          $oneKey = $release.assets | Where-Object { $_.name -like "*OneKey*.zip" } | Select-Object -First 1
          if ($oneKey) {
            Write-Host "Downloading $($oneKey.name)..."
            Invoke-WebRequest -Uri $oneKey.browser_download_url -OutFile "napcat_onekey.zip"
            Expand-Archive -Path "napcat_onekey.zip" -DestinationPath "temp_onekey" -Force
            if (Test-Path "temp_onekey/bootmain") {
              Copy-Item -Path "temp_onekey/bootmain/*" -Destination $dest -Recurse -Force
            }
            $innerZip = Get-ChildItem -Path "temp_onekey" -Filter "NapCat.Shell.zip" -Recurse | Select-Object -First 1
            if ($innerZip) {
              Expand-Archive -Path $innerZip.FullName -DestinationPath $dest -Force
            }
            Remove-Item -Recurse -Force "temp_onekey", "napcat_onekey.zip"
            Write-Host "NapCat bundled successfully into $dest"
          } else {
            Write-Error "Failed to locate NapCat asset on GitHub releases."
            exit 1
          }

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EazyQQ ${{ github.ref_name }}'
          releaseBody: '自动化构建发布的 EazyQQ 桌面客户端。'
          releaseDraft: false
          prerelease: true
