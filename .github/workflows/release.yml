name: Release EazyQQ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Bundle NapCat into resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Fetch latest NapCat release info
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest' -Headers @{ 'User-Agent' = 'EazyQQ-CI' }
          $shellAsset = $release.assets | Where-Object { $_.name -eq 'NapCat.Shell.zip' } | Select-Object -First 1
          $onekeyAsset = $release.assets | Where-Object { $_.name -like '*OneKey*' } | Select-Object -First 1

          if (-not $shellAsset) { throw 'NapCat.Shell.zip not found in latest release' }

          $resourceDir = 'src-tauri/resources/napcat'
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null

          # Download and extract NapCat Shell (core runtime: napcat.mjs, static/, node_modules/, etc.)
          $shellZip = "$env:TEMP/NapCat.Shell.zip"
          Write-Host "Downloading $($shellAsset.name) ($([math]::Round($shellAsset.size / 1MB, 1)) MB)..."
          Invoke-WebRequest -Uri $shellAsset.browser_download_url -OutFile $shellZip
          Expand-Archive -Path $shellZip -DestinationPath $resourceDir -Force
          Remove-Item $shellZip


          Write-Host "NapCat bundled into $resourceDir"
          Get-ChildItem $resourceDir | Select-Object Name, Length

      - name: Build EazyQQ CLI
        shell: pwsh
        run: |
          cd src-tauri
          cargo build --release --bin eazyqq_cli
          cd ..
          $distDir = "eazyqq-cli-dist"
          New-Item -ItemType Directory -Path "$distDir/bin" -Force | Out-Null
          Copy-Item "src-tauri/target/release/eazyqq_cli.exe" "$distDir/bin/eazyqq_cli.exe" -Force
          Copy-Item "src-tauri/target/release/eazyqq_cli.exe" "$distDir/bin/ezq.exe" -Force
          Copy-Item "src-tauri/target/release/eazyqq_cli.exe" "src-tauri/target/release/ezq.exe" -Force
          if (Test-Path "src-tauri/resources/napcat") {
            Copy-Item "src-tauri/resources/napcat" "$distDir/napcat" -Recurse -Force
          }
          Compress-Archive -Path "$distDir/*" -DestinationPath "eazyqq-cli-windows-x64.zip" -Force

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EazyQQ ${{ github.ref_name }}'
          releaseBody: '自动化构建发布的 EazyQQ 桌面客户端与独立无头 CLI 工具（内置 NapCat 协议，开箱即用）。'
          releaseDraft: false
          prerelease: false

      - name: Upload CLI Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            eazyqq-cli-windows-x64.zip
            src-tauri/target/release/eazyqq_cli.exe
            src-tauri/target/release/ezq.exe
