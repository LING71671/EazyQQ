name: Release EazyQQ

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Use canonical source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm from package metadata
        uses: pnpm/action-setup@v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version' }
          pnpm version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "docs/release/$env:RELEASE_TAG.md")) { throw 'Chinese release notes are missing' }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare official NapCat resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest' -Headers @{ 'User-Agent' = 'EazyQQ-CI' }
          $asset = $release.assets | Where-Object name -eq 'NapCat.Shell.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Official NapCat.Shell.zip is unavailable' }
          $archive = Join-Path $env:RUNNER_TEMP 'NapCat.Shell.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          New-Item -ItemType Directory -Path napcat -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath napcat -Force
          pnpm prepare:resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release/check-resources.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check types, interfaces and frontend behavior
        shell: pwsh
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm contracts:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust regressions
        run: pnpm test:rust

      - name: Build desktop and CLI
        run: pnpm tauri:build

      - name: Validate release CLI and native account profiles
        shell: pwsh
        run: |
          $env:EAZYQQ_TEST_CLI = (Resolve-Path src-tauri/target/release/eazyqq_cli.exe).Path
          $env:EAZYQQ_TEST_GUI = (Resolve-Path src-tauri/target/release/eazyqq.exe).Path
          pnpm test:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare validated distribution assets
        run: pnpm release:package

      - name: Keep release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eazyqq-${{ env.RELEASE_TAG }}-windows-x64
          path: output/release/*/*
          if-no-files-found: error

      - name: Publish release after all checks pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(Get-ChildItem -LiteralPath "output/release/$version" -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "EazyQQ $env:RELEASE_TAG" --notes-file "docs/release/$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest --title "EazyQQ $env:RELEASE_TAG" --notes-file "docs/release/$env:RELEASE_TAG.md"
          exit $LASTEXITCODE
