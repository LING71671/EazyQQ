[package]
name = "eazyqq"
version = "0.10.0"
description = "EazyQQ Desktop Application"
authors = ["EazyQQ Team"]
edition = "2021"
# The GUI binary stays the default target; `eazyqq-cli` is an explicit opt-in
# (`cargo run --bin eazyqq-cli -- status`) so `tauri dev` keeps working unchanged.
default-run = "eazyqq"

[lib]
name = "eazyqq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3"

