      <rect x="18" y="16" width="56" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.75" />
      <text x="46" y="31.5" text-anchor="middle" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">DESKTOP</text>
      <text x="18" y="64" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">图形工作台</text>
      <text x="18" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">React 19 + Tauri 2</text>
      <text x="18" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">白名单规则 · AI 草稿箱审核</text>
    </g>

    <g transform="translate(256, 0)" filter="url(#card-shadow)">
