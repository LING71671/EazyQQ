<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" fill="none">
  <defs>
    <linearGradient id="canvas-grad" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <radialGradient id="sky-glow" cx="600" cy="140" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#f0f9ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.7" />
    </pattern>

    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.02" />
    </filter>

    <filter id="logo-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.22" />
    </filter>

    <linearGradient id="eazyqq-grad-primary" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="eazyqq-grad-sparkle" x1="60" y1="40" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="16" fill="url(#canvas-grad)" />
  <rect width="1200" height="440" rx="16" fill="url(#light-grid)" />
  <rect width="1200" height="440" rx="16" fill="url(#sky-glow)" />
  <rect x="0.5" y="0.5" width="1199" height="439" rx="15.5" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(600, 142)">
    <g transform="translate(-40, -96)" filter="url(#logo-drop)">
      <rect x="11" y="15" width="50" height="40" rx="12.5" fill="url(#eazyqq-grad-primary)" />
      <path d="M21 55 L21 65 Q21 67.5 23.5 66.2 L35 55 Z" fill="#0284c7" />
      <rect x="17.5" y="21.2" width="37.5" height="27.5" rx="7.5" fill="#ffffff" fill-opacity="0.95" />
      <rect x="23.7" y="28.7" width="13.7" height="2.5" rx="1.25" fill="#0284c7" />
      <rect x="23.7" y="35" width="23.7" height="2.5" rx="1.25" fill="#94a3b8" />
      <rect x="23.7" y="41.2" width="18.7" height="2.5" rx="1.25" fill="#cbd5e1" />
      <g transform="translate(42.5, 10)">
        <circle cx="15" cy="15" r="13.7" fill="#ffffff" />
        <path d="M15 6.2 Q15 15 23.7 15 Q15 15 15 23.7 Q15 15 6.2 15 Q15 15 15 6.2 Z" fill="url(#eazyqq-grad-sparkle)" />
      </g>
    </g>

    <text text-anchor="middle" y="28" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">
      EazyQQ
    </text>

    <text text-anchor="middle" y="60" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.01em">
      个人专属 QQ 助手与自动化调度系统 · 双模运行架构
    </text>
  </g>

  <g transform="translate(100, 276)">
