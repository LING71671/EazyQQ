      <rect x="18" y="16" width="60" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.75" />
      <text x="48" y="31.5" text-anchor="middle" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">DESKTOP</text>
      <text x="18" y="68" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">图形工作台</text>
      <text x="18" y="93" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">React 19 + Tauri 2</text>
      <text x="18" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">白名单规则 · AI 草稿箱审核</text>
