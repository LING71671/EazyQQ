<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="canvas-grad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <radialGradient id="sky-glow" cx="640" cy="210" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#f0f9ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.7" />
    </pattern>

    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.02" />
    </filter>

    <filter id="logo-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <linearGradient id="eazyqq-grad-primary" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="eazyqq-grad-sparkle" x1="60" y1="40" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" rx="16" fill="url(#canvas-grad)" />
  <rect width="1280" height="640" rx="16" fill="url(#light-grid)" />
  <rect width="1280" height="640" rx="16" fill="url(#sky-glow)" />
  <rect x="0.5" y="0.5" width="1279" height="639" rx="15.5" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(640, 205)">
    <g transform="translate(-48, -120)" filter="url(#logo-drop)">
      <rect x="13" y="18" width="60" height="48" rx="15" fill="url(#eazyqq-grad-primary)" />
      <path d="M25 66 L25 78 Q25 81 28 79.5 L42 66 Z" fill="#0284c7" />
      <rect x="21" y="25" width="45" height="33" rx="9" fill="#ffffff" fill-opacity="0.95" />
      <rect x="28" y="34" width="16" height="3" rx="1.5" fill="#0284c7" />
      <rect x="28" y="42" width="28" height="3" rx="1.5" fill="#94a3b8" />
      <rect x="28" y="50" width="22" height="3" rx="1.5" fill="#cbd5e1" />
      <g transform="translate(51, 12)">
        <circle cx="18" cy="18" r="16.5" fill="#ffffff" />
        <path d="M18 7.5 Q18 18 28.5 18 Q18 18 18 28.5 Q18 18 7.5 18 Q18 18 18 7.5 Z" fill="url(#eazyqq-grad-sparkle)" />
      </g>
    </g>

    <text text-anchor="middle" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.03em">
      EazyQQ
    </text>

    <text text-anchor="middle" y="70" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.01em">
      个人专属 QQ 助手与自动化调度系统 · 双模运行架构
    </text>
