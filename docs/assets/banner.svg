      <rect x="18" y="16" width="68" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.75" />
      <text x="52" y="31.5" text-anchor="middle" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">PROTOCOL</text>
      <text x="18" y="64" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">无头控制集</text>
      <text x="18" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">短命令 ezq (别名 eazyqq_cli)</text>
      <text x="18" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">单文件独立常驻 · 扫码探活</text>
    </g>

    <g transform="translate(512, 0)" filter="url(#card-shadow)">
      <rect width="232" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <rect x="18" y="16" width="62" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.75" />
      <text x="49" y="31.5" text-anchor="middle" fill="#7c3aed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">AI AGENT</text>
      <text x="18" y="64" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">智能体生态</text>
      <text x="18" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">stdio MCP 服务通道</text>
      <text x="18" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Cursor / Claude / 外部 Agent</text>
    </g>

    <g transform="translate(768, 0)" filter="url(#card-shadow)">
      <rect width="232" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <rect x="18" y="16" width="70" height="22" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.75" />
      <text x="53" y="31.5" text-anchor="middle" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">INSTANCES</text>
      <text x="18" y="64" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">原生多开并发</text>
      <text x="18" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">免 Docker / 免虚拟机</text>
      <text x="18" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">端口自动分配 · 账号隔离</text>
