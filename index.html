<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EazyQQ - 个人专属 QQ 智能助手</title>
    <style>
      html, body {
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ---- Boot splash: painted before any JS runs, so the window never looks
             frozen while Vite / React are still coming up. ---- */
      #boot-splash {
        display: flex;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #boot-splash .boot-mark {
        position: relative;
        width: 52px;
        height: 52px;
      }
      #boot-splash .boot-ring {
        position: absolute;
        inset: -7px;
        border-radius: 22px;
        border: 2px solid rgba(2, 132, 199, 0.14);
        border-top-color: #0284c7;
        border-right-color: #38bdf8;
        animation: boot-spin 0.9s linear infinite;
        will-change: transform;
      }
      #boot-splash .boot-badge {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 3px rgba(2, 132, 199, 0.08);
      }
      #boot-splash .boot-badge img {
        width: 30px;
        height: 30px;
        display: block;
      }
      #boot-splash .boot-word {
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: 0.2px;
      }
      #boot-splash .boot-track {
        width: 164px;
        height: 3px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      #boot-splash .boot-bar {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: #0284c7;
        animation: boot-slide 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        will-change: transform;
      }
      #boot-splash .boot-hint {
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.4px;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-105%); }
        100% { transform: translateX(345%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-ring,
        #boot-splash .boot-bar {
          animation-duration: 2.6s;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased select-none overflow-hidden">
    <div id="root">
      <div id="boot-splash">
        <div class="boot-mark">
          <span class="boot-ring"></span>
          <div class="boot-badge">
            <img src="/src/assets/logo.svg" alt="EazyQQ" />
          </div>
        </div>
        <div class="boot-word">EazyQQ</div>
        <div class="boot-track"><span class="boot-bar"></span></div>
        <div class="boot-hint">正在初始化本地运行环境</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
